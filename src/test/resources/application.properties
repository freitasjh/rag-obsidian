obsidian.vault.path=/home/joao/vault
obsidian.vault.name=main

ollama.base-url=http://localhost:11434
ollama.embedding-model=nomic-embed-text

langchain4j.store.path=/tmp/obsidian-rag-test-store/embeddings.json

rag.chunk-size=1000
rag.chunk-overlap=200
rag.max-results=10

mcp.server.name=obsidian-rag
mcp.server.version=1.0.0

quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization

quarkus.log.level=INFO
quarkus.log.category."br.com.freitasjh.obsidianrag".level=DEBUG
quarkus.banner.enabled=true
