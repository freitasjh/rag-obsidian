# LangChain4j persistent store path
langchain4j.store.path=${user.home}/.obsidian-rag/embeddings.json

# Obsidian
obsidian.vault.path=/home/joao/progat/wsProjetos/atlas-admin/brain
obsidian.vault.name=brain

# RAG
rag.chunk-size=1000
rag.chunk-overlap=200
rag.max-results=10

# HTTP
quarkus.http.port=8087
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization

# Logging
quarkus.log.level=INFO
quarkus.log.category."br.com.freitasjh.obsidianrag".level=DEBUG
quarkus.log.console.stderr=true

quarkus.banner.enabled=true


